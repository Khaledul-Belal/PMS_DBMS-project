<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — Baribari</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .sidebar {
      background: #10190f;
    }

    .nav button.active {
      background: #7a5c0c;
    }

    .brand-mark span.dot {
      background: #b57f12;
    }
  </style>
</head>

<body>

  <div class="app-bar">
    <div class="brand-mark"><span class="dot"></span> Baribari</div>
    <button id="sideToggle" aria-label="Open menu" aria-expanded="false">&#9776;</button>
  </div>

  <div class="shell">
    <aside class="sidebar">
      <div>
        <div class="brand-mark"><span class="dot"></span> Baribari</div>
        <div class="side-role">System admin</div>
      </div>

      <nav class="nav" id="nav">
        <button data-view="overview" class="active">Platform overview</button>
        <button data-view="owners">Subscribers</button>
        <button data-view="subs">Subscriptions</button>
        <button data-view="plans">Plans &amp; pricing</button>
      </nav>

      <div class="side-foot">
        <div id="whoName" style="color:#fff;font-weight:500"></div>
        <div id="whoEmail" style="font-size:.8rem;color:#8ea092"></div>
        <a href="index.html">&#8592; View website</a>
        <button class="btn ghost small" id="logout" style="margin-top:.6rem;width:100%">Sign out</button>
      </div>
    </aside>

    <main class="main" id="main">
      <div class="empty">Loading…</div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>

  <script>
    /* mobile: show and hide the sidebar */
    (function () {
      var t = document.getElementById('sideToggle');
      var s = document.querySelector('.sidebar');
      if (!t || !s) return;
      t.addEventListener('click', function () {
        var open = s.classList.toggle('open');
        t.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      s.addEventListener('click', function (e) {
        if (e.target.closest('.nav button') && window.innerWidth <= 860) s.classList.remove('open');
      });
    })();
  </script>
</body>

</html>
